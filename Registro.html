<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de visitantes</title>
    <link rel="stylesheet" href="Registro.css">
</head>

<body>

    <header>
        <h1>Registro de visitantes</h1>
        <p>Regístrate para conocer más sobre Puerto López.</p>
    </header>

    <main class="contenedor">

        <h2>Formulario de registro</h2>

        <form id="formulario">

            <label for="nombre">Nombre completo:</label>
            <input type="text" id="nombre" required>

            <label for="correo">Correo electrónico:</label>
            <input type="email" id="correo" required>

            <label for="edad">Edad:</label>
            <input type="number" id="edad" min="1" max="100" required>

            <label for="carrera">Carrera:</label>
            <input type="text" id="carrera" required>

            <button type="submit">Registrar</button>

        </form>

         <p id="mensaje"></p>

        <p><a href="Inicio.html">Volver al inicio</a></p>

    </main>

    <footer>
        <p>Puerto López, Manabí - Ecuador</p>
    </footer>

    <script src="Registro.js"></script>

</body>
</html>
